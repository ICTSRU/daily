function esc(s){ return String(s==null?'':s).replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
function safeUrl(u){
  u = String(u||'').trim(); if(!u) return '#';
  if(/^https?:\/\//i.test(u)) return u;
  if(/^[a-z][a-z0-9+.-]*:/i.test(u)) return '#';          // block javascript:, data:, etc.
  return 'http://' + u;
}
function linkify(t){

// Local-safe dates (never toISOString — it shifts to UTC and can roll the day back)
function toISO(d){ return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0'); }
function parseISO(s){ const m=String(s).slice(0,10).split('-'); return new Date(+m[0], +m[1]-1, +m[2]); }
function todayISO(){ return toISO(new Date()); }
function addDays(iso, n){ const d=parseISO(iso); d.setDate(d.getDate()+n); return toISO(d); }
function daysBetween(a, b){ return Math.round((parseISO(b)-parseISO(a))/86400000); }
function fmtDay(iso, short){
  if(!iso) return '—';
  return parseISO(iso).toLocaleDateString('en-GB', short ? {weekday:'short', day:'2-digit', month:'short'} : {weekday:'long', day:'2-digit', month:'long', year:'numeric'});
}
function fmtDate(iso){ return iso ? parseISO(iso).toLocaleDateString('en-GB',{day:'2-digit', month:'short', year:'numeric'}) : '—'; }
function worst(items){ return items.reduce((w,i)=> RANK[i.s] > RANK[w] ? i.s : w, 'Normal'); }
function countBy(items){ const c={Normal:0,Minor:0,Major:0,Critical:0}; items.forEach(i=>{ c[i.s]=(c[i.s]||0)+1; }); return c; }
function sslState(expiry, onDate){
  if(!expiry) return {txt:'—', cls:'st-None', days:null};
  const d = daysBetween(onDate || todayISO(), expiry);
  if(d < 0)   return {txt:'Expired', cls:'st-Critical', days:d};
  if(d <= 30) return {txt:'Valid · '+d+'d', cls:'st-Critical', days:d};
  if(d <= 60) return {txt:'Valid · '+d+'d', cls:'st-Major', days:d};
  if(d <= 90) return {txt:'Valid · '+d+'d', cls:'st-Minor', days:d};
  return {txt:'Valid', cls:'st-Normal', days:d};
}

function linesToList(t){ return String(t||'').split('\n').map(l=>l.replace(/^\s*\d+\.\s*/,'').trim()).filter(Boolean); }
function listToLines(a){ return a.map((v,i)=>(i+1)+'. '+v).join('\n'); }

// google.script.run as a promise (every server function re-checks the access list)
function gsr(fn, ...args){
  return new Promise((res, rej)=>{
    google.script.run.withSuccessHandler(res)
      .withFailureHandler(e=>rej(new Error((e && e.message) || String(e))))[fn](...args);
  });
}

let _mem = null, _cache = null, _cacheAt = 0, _online = null;

function localLoad(){
  if(_mem) return _mem;
  try{ const raw = localStorage.getItem(LOCAL_KEY); _mem = raw ? JSON.parse(raw) : null; }catch(e){ _mem = null; }
  if(!_mem){ _mem = seedRows(); localSave(); }
  return _mem;
}
function localSave(){ try{ localStorage.setItem(LOCAL_KEY, JSON.stringify(_mem)); }catch(e){} }

// Sheet row <-> record. Key "YYYY-MM-DD|UNIT" is the upsert key (also immune to Sheets date reformatting).
function toRow(r){
  return { Key:r.date+'|'+r.unit, Date:r.date, Unit:r.unit, Status:r.status, CheckTime:r.time,
    Items:JSON.stringify(r.items), Normal:r.counts.Normal, Minor:r.counts.Minor, Major:r.counts.Major, Critical:r.counts.Critical,
    MainTasks:listToLines(r.tasks), HotIssues:listToLines(r.hot), NotAvailable:absToLines(r.absent||[]), Attachments:(r.att&&r.att.length)?JSON.stringify(r.att):'', Notes:r.notes, MorningSupport:r.support,
    SubmittedBy:r.by, Timestamp:r.ts };
}
function fromRow(row){
  const key = String(row.Key||''); const [date, unit] = key.includes('|') ? key.split('|') : [String(row.Date||'').slice(0,10), row.Unit];
  let items = []; try{ items = JSON.parse(row.Items||'[]'); }catch(e){}
  return { date, unit, status: row.Status || worst(items), time: row.CheckTime||'', items,
    counts: countBy(items), tasks: linesToList(row.MainTasks), hot: linesToList(row.HotIssues), absent: linesToAbs(row.NotAvailable), att: parseAtt(row.Attachments),
    notes: row.Notes||'', support: row.MorningSupport||'', by: row.SubmittedBy||'', ts: row.Timestamp||'' };
}

async function fetchAll(force){
  if(LOCAL_MODE) return localLoad().map(fromRow);
  if(!force && _cache && Date.now()-_cacheAt < 15000) return _cache;
  sheetLoading(+1);
  try{
    let rows;
    if(BACKEND==='gsr') rows = await gsr('apiList');
    else {
      const res = await fetch(BACKEND==='gas' ? GAS : DATA_URL(), {method:'GET', redirect:'follow'});
      if(!res.ok) throw new Error('HTTP '+res.status);
      rows = await res.json();
    }
    if(rows && rows.ok === false) throw new Error(rows.error||'Sheet error');
    _cache = (Array.isArray(rows)?rows:[]).filter(r=>r.Key||r.Date).map(fromRow).filter(r=>r.date && r.unit);
    _cacheAt = Date.now(); setConn(true);
  }catch(e){ setConn(false, e.message); toast('Could not load data from the Google Sheet. Check your connection.'); _cache = _cache || []; }
  finally{ sheetLoading(-1); }
  return _cache;
}
// v3.3 — glow on "Get from Sheet" (and the connection dot) while any read from the Sheet is in progress
let _loadingN = 0;
function sheetLoading(d){
  _loadingN = Math.max(0, _loadingN + d);
  const on = _loadingN > 0, b = document.getElementById('btn-load-day'), bar = document.getElementById('conn-bar');
  if(b){ b.classList.toggle('loading', on); b.disabled = on; b.querySelector('.ld-lbl').textContent = on ? 'Loading…' : 'Get from Sheet'; b.setAttribute('aria-busy', on); }
  if(bar) bar.classList.toggle('syncing', on);
}
// Apps Script: text/plain avoids a CORS preflight; the script still parses the JSON body
async function gasPost(payload){
  if(BACKEND==='gsr'){
    const out = payload.action==='save'   ? await gsr('apiSave', payload.row)
              : payload.action==='delete' ? await gsr('apiDelete', payload.key)
              : payload.action==='upload' ? await gsr('apiUpload', payload)
              : {ok:false, error:'Unknown action'};
    if(!out || out.ok === false) throw new Error((out && out.error) || 'Request failed');
    return out;
  }
  const res = await fetch(GAS, {method:'POST', redirect:'follow', headers:{'Content-Type':'text/plain;charset=utf-8'}, body:JSON.stringify(payload)});
  const out = await res.json();
  if(!out || out.ok === false) throw new Error((out && out.error) || 'Save failed');
  return out;
}
async function saveRecord(rec){
  const row = toRow(rec);
  if(LOCAL_MODE){
    const rows = localLoad(); const i = rows.findIndex(r=>r.Key===row.Key);
    if(i>=0) rows[i]=row; else rows.push(row); localSave(); return;
  }
  if(REMOTE_GS) await gasPost({action:'save', row});
  else {
    const res = await fetch(SUBMIT_URL(), {method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify(row)});
    if(!res.ok) throw new Error('Save failed');
  }
  await fetchAll(true);
}
async function deleteRecord(date, unit){
  const key = date+'|'+unit;
  if(LOCAL_MODE){ _mem = localLoad().filter(r=>r.Key!==key); localSave(); return; }
  if(REMOTE_GS) await gasPost({action:'delete', key});
  else throw new Error('Delete is available with the Google Sheet connection.');
  await fetchAll(true);
}

/* ---------- Connection bar ---------- */
function setConn(ok, msg){
  _online = ok;
  const bar = $('conn-bar'), txt = $('conn-text');
  bar.classList.remove('ok','local','err');
  if(LOCAL_MODE){
    bar.classList.add('local');
    txt.innerHTML = 'Not connected — entries are saved in <b>this browser only</b>. Click <b>Connect</b> and paste the Google Sheet Web App URL.';
  } else if(ok){
    bar.classList.add('ok');
    txt.innerHTML = BACKEND==='gsr'
      ? '🔒 Secure access — signed in as <b dir="ltr">' + esc(ME_EMAIL || 'university account') + '</b> · every save is stored in Google Sheet <b>ICTD Daily Check Report - Data</b>.'
      : 'Connected to Google Sheet <b>ICTD Daily Check Report - Data</b>' + (BACKEND==='n8n' ? ' (via n8n)' : '') + ' — every save is stored there.';
  } else {
    bar.classList.add('err');
    txt.innerHTML = 'Cannot reach the Google Sheet' + (msg ? ' (' + esc(msg) + ')' : '') + (BACKEND==='gsr' ? '. Reload the page; if it continues, contact the platform owner.' : '. Check the Web App deployment.');
  }
  $('conn-set').querySelector('span').textContent = LOCAL_MODE ? 'Connect' : 'Change connection';
  $('conn-set').hidden = !!GAS_URL || BACKEND==='gsr';   // connection is built into the page
}
$('conn-set').onclick = async ()=>{
  const cur = GAS || '';
  const url = prompt('Paste the Google Apps Script Web App URL (ends with /exec).\nLeave empty to disconnect this browser.', cur);
  if(url === null) return;
  const u = url.trim();
  if(u && !/^https:\/\/script\.google(usercontent)?\.com\/.+/.test(u)){ toast('That does not look like an Apps Script Web App URL.'); return; }
  if(u){
    try{ const r = await fetch(u, {redirect:'follow'}); const j = await r.json(); if(!Array.isArray(j)) throw new Error((j&&j.error)||'Unexpected reply'); }
    catch(e){ if(!confirm('Could not verify the URL ('+e.message+'). Save it anyway?')) return; }
  }
  lsSet(GAS_KEY, u || null); location.reload();
};

function fillForm(rec, mode, fromDate){
  const unit = unitBy($('f-unit').value);

  if(rec){
    formItems = JSON.parse(JSON.stringify(rec.items));

      $('f-notes').value = rec.notes; setSup(rec.support); setAbs(rec.absent); setAtt(rec.att);
      $('f-name').innerHTML = nameOptions(rec.by);
      if(mode==='copy') setBanner('info', 'Copied from '+fmtDay(fromDate,true)+' into '+fmtDay($('f-date').value,true)+' — review, then Save to store it for this day.');
      else { const past = $('f-date').value < todayISO();
        setBanner('edit', (past ? 'Restored the saved report for '+fmtDay(rec.date,true)+'.' : 'A report for this unit and day is already saved.')+' Saving will overwrite it'+(LOCAL_MODE?'.':' in the Google Sheet.'), {copy:past, del:true}); }
    } else {
      // carry the checklist and today's task list forward; issues and notes start clean
      $('f-time').value = '09:00';
      setList('list-tasks', rec.tasks); setList('list-hot', []);
      $('f-notes').value = ''; setSup(''); setAbs([]); setAtt([]);
      $('f-name').innerHTML = nameOptions(ME_NAME || rec.by || unit.owner);
      setBanner('info', 'New entry — prefilled from the last report ('+fmtDay(fromDate,true)+'). Statuses and notes are carried over — update anything that changed today.');

    $('f-notes').value=''; setSup(''); setAbs([]); setAtt([]); $('f-name').innerHTML = nameOptions(ME_NAME || unit.owner);
    banner.hidden = true;

  $('f-saved').innerHTML = `<option value="">${recs.length ? '— '+recs.length+' saved report'+(recs.length>1?'s':'')+' for '+esc(unitBy(unit).label)+' —' : 'No saved reports yet for '+esc(unitBy(unit).label)}</option>` +

let _loadSeq = 0;
async function loadFormFor(force){
  const my = ++_loadSeq;
  const date = $('f-date').value, unit = $('f-unit').value; if(!date) return;
  const all = await fetchAll(force);
  if(my !== _loadSeq) return;                         // a newer unit/day was picked meanwhile — ignore this result
  if(date !== $('f-date').value || unit !== $('f-unit').value) return;
  refreshSaved(all);
  const ex = findRec(all, date, unit);
  if(ex) return fillForm(ex, 'edit');
  const prev = lastBefore(all, date, unit);
  if(prev) return fillForm(prev, 'prefill', prev.date);
  fillForm(null);
}

const ATT_TYPES = ['PRTG','Firewall','Wireless / WLC','Switch / Core','UC','Other'];
const ATT_DEFAULT_CAP = {PRTG:'Internet, STC, Mobily and KACST traffic (last 2 hours)'};
let attItems = [];
function parseAtt(t){ try{ const a = JSON.parse(t||'[]'); return Array.isArray(a) ? a : []; }catch(e){ return []; } }
function attSrc(a, w){ return a.id ? 'https://drive.google.com/thumbnail?id='+encodeURIComponent(a.id)+'&sz=w'+(w||800) : (a.url||''); }
function attView(a){ return a.id ? 'https://drive.google.com/file/d/'+encodeURIComponent(a.id)+'/view' : (a.url||'#'); }
function attBusy(){ return attItems.some(a=>a.status==='up'); }
function newAtt(){ return {type:'PRTG', cap:ATT_DEFAULT_CAP.PRTG, id:'', url:'', name:'', status:''}; }
function setAtt(list){
  attItems = (list && list.length) ? list.map(a=>Object.assign({status:'ok'}, a)) : [newAtt()];
  renderAtt();
}
function getAtt(){ return attItems.filter(a=>a.id || a.url).map(a=>({type:a.type, cap:(a.cap||'').trim(), id:a.id||'', url:a.url||'', name:a.name||''})); }
function renderAtt(){
  const c = $('list-att'); if(!c) return;
  c.innerHTML = attItems.map((a,i)=>{
    const has = a.id || a.url;
    const st = a.status==='up' ? '<span class="att-state up">Uploading…</span>'
      : a.status==='err' ? '<span class="att-state err">'+esc(a.err||'Upload failed')+'</span>'
      : has ? '<span class="att-state ok">✓ '+(LOCAL_MODE?'Attached':'Saved to Google Drive')+'</span>' : '<span class="att-state">No image yet</span>';
    return `<div class="att-row" data-att="${i}" tabindex="0" title="Click here, then paste a screenshot (Ctrl+V)">
      <div class="att-thumb">${has ? `<a href="${esc(attView(a))}" target="_blank" rel="noopener noreferrer"><img src="${esc(attSrc(a,400))}" alt="${esc(a.type)}"></a>` : 'Paste or<br>choose image'}</div>
      <div class="att-fields">
        <div class="att-line">
          <select data-a="type" aria-label="Image type">${ATT_TYPES.map(t=>`<option${t===a.type?' selected':''}>${t}</option>`).join('')}</select>

    </div>`;
  }).join('');
  icons();
}

document.addEventListener('paste', e=>{
  if(!$('view-submit').classList.contains('active') || !unitBy($('f-unit').value).images) return;
  const item = [...((e.clipboardData && e.clipboardData.items) || [])].find(x=>x.type && x.type.startsWith('image/'));
  if(!item) return;
  const inText = e.target && (e.target.tagName==='INPUT' || e.target.tagName==='TEXTAREA') && !e.target.closest('.att-row');
  if(inText) return;                                   // normal paste into other text fields
  e.preventDefault();
  const focused = document.activeElement && document.activeElement.closest && document.activeElement.closest('.att-row');

  if(i < 0){ attItems.push(newAtt()); i = attItems.length-1; }
  const f = item.getAsFile(); uploadAtt(i, new File([f], 'screenshot-'+Date.now()+'.png', {type:f.type||'image/png'}));
});
// shrink large images so uploads stay fast (graphs stay sharp: PNG kept if already small)
function prepImage(file){
  return new Promise((res, rej)=>{
    const rd = new FileReader();
    rd.onerror = ()=>rej(new Error('Could not read the image'));
    rd.onload = ()=>{
      const url = rd.result;
      if(file.size <= 1.5*1024*1024) return res({data:url, mime:file.type||'image/png'});
      const img = new Image();
      img.onload = ()=>{
        const max = 2000, k = Math.min(1, max/Math.max(img.width, img.height));
        const cv = document.createElement('canvas'); cv.width = Math.round(img.width*k); cv.height = Math.round(img.height*k);
        const cx = cv.getContext('2d'); cx.fillStyle='#fff'; cx.fillRect(0,0,cv.width,cv.height); cx.drawImage(img,0,0,cv.width,cv.height);
        res({data:cv.toDataURL('image/jpeg', .88), mime:'image/jpeg'});
      };
      img.onerror = ()=>rej(new Error('Not a valid image'));
      img.src = url;
    };
    rd.readAsDataURL(file);
  });
}
async function uploadAtt(i, file){
  if(!file || !file.type.startsWith('image/')){ toast('Please choose an image file.'); return; }
  const a = attItems[i]; a.status='up'; a.err=''; renderAtt(); dirty=true;
  try{
    const {data, mime} = await prepImage(file);
    const date = $('f-date').value, unit = $('f-unit').value;
    const ext = mime==='image/jpeg' ? '.jpg' : (mime==='image/png' ? '.png' : '');
    const name = `${date}_${unit}_${a.type.replace(/[^A-Za-z0-9]+/g,'-')}_${Date.now()}${ext}`;
    if(LOCAL_MODE){ a.url = data; a.id = ''; a.name = name; }
    else if(REMOTE_GS){
      const out = await gasPost({action:'upload', date, unit, name, mime, data:data.split(',')[1]});
      a.id = out.id; a.url = out.url; a.name = out.name || name;
    } else throw new Error('Image upload needs the Google Sheet connection');
    a.status = 'ok'; renderAtt();
  }catch(e){
    a.status = 'err';
    a.err = /Unknown action|Missing Key/.test(e.message) ? 'Update Code.gs to enable uploads'
          : /DriveApp|permission/i.test(e.message) ? 'Apps Script needs Google Drive permission — the owner must run setup and deploy a new version'
          : (e.message||'Upload failed');
    renderAtt();
  }
}

// consecutive report-days an item has been non-Normal (including the given day)
function streak(all, unit, name, date){
  const recs = all.filter(r=>r.unit===unit && r.date<=date).sort((a,b)=>b.date.localeCompare(a.date));
  let n=0, since=date;
  for(const r of recs){ const it = r.items.find(i=>i.n===name); if(it && it.s!=='Normal'){ n++; since=r.date; } else break; }
  return {n, since};
}

function sslList(all, date){
  return UNITS.filter(u=>u.ssl).flatMap(u=>{
    const r = findRec(all,date,u.code) || lastBefore(all,date,u.code);
    return r ? r.items.filter(i=>i.e).map(i=>({u, i, from:r.date, st:sslState(i.e, date)})) : [];
  });
}
function trendDays(all){
  const have = new Set(all.map(r=>r.date)); const out=[]; let d = todayISO(); let guard=0;
  while(out.length<14 && guard<40){ if(isWorkDay(d) || have.has(d)) out.push(d); d = addDays(d,-1); guard++; }
  return out;
}

}

function renderHeatmap(all){
  const unit = unitBy($('hm-unit').value), days = trendDays(all).slice().reverse();
  const recs = days.map(d=>findRec(all,d,unit.code));
  // service list: template order, then any extra names seen in the period
  const names = []; const seen = new Set();
  const push = (g,n)=>{ const k=g+'¦'+n; if(!seen.has(k)){ seen.add(k); names.push({g,n}); } };
  unit.template.forEach(i=>push(i.g,i.n)); recs.forEach(r=>r&&r.items.forEach(i=>push(i.g,i.n)));
  let list = names;
  if($('hm-issues').checked) list = names.filter(x=>recs.some(r=>r && r.items.some(i=>i.n===x.n && i.g===x.g && i.s!=='Normal')));
  let h = `<tr><th class="lbl">Service / Device</th>${days.map(d=>`<th class="${d===dashDate?'sel':''}"><button class="day-th" data-day="${d}">${fmtDay(d,true).replace(' ','<br>')}</button></th>`).join('')}</tr>`;
  if(!list.length) h += `<tr><td class="lbl" colspan="${days.length+1}" style="color:var(--muted);">No issues recorded in this period.</td></tr>`;
  let g = null;
  list.forEach(x=>{
    if(x.g!==g){ g=x.g; h += `<tr><td class="grp-row" colspan="${days.length+1}">${esc(g)}</td></tr>`; }
    h += `<tr><td class="lbl">${esc(x.n)}</td>` + recs.map((r,k)=>{
      const it = r && r.items.find(i=>i.n===x.n && i.g===x.g); const s = it?it.s:'None';
      const tip = `${x.n} — ${fmtDay(days[k],true)} — ${it?s:'Not reported'}${it&&it.t?' — '+it.t:''}`;
      return `<td><button class="cell-btn" data-day="${days[k]}" title="${esc(tip)}" aria-label="${esc(tip)}"><span class="dot dot-${s}"></span></button></td>`;
    }).join('') + '</tr>';
  });
  $('heatmap').innerHTML = h;
}

// dashboard card buttons
$('unit-grid').addEventListener('click', e=>{
  const f = e.target.closest('[data-open-form]'), r = e.target.closest('[data-open-report]');
  if(f){
    if(dirty && !confirm('You have unsaved changes on the form. Discard them?')) return;
    $('f-unit').value = f.dataset.openForm; $('f-date').value = f.dataset.day; _lastSel = {date:f.dataset.day, unit:f.dataset.openForm};
    document.querySelector('.navbar button[data-view="submit"]').click(); loadFormFor(); window.scrollTo({top:0, behavior:'smooth'});
  }
  if(r){ $('r-date').value = r.dataset.openReport; document.querySelector('.navbar button[data-view="compiled"]').click(); }
});
// deep links: #dashboard or #report opens that tab directly
const hv = String(BOOT.view || location.hash.replace('#','')); const navTo = {dashboard:'dashboard', report:'compiled'}[hv];
loadFormFor().then(()=>{ if(navTo) document.querySelector(`.navbar button[data-view="${navTo}"]`).click(); });
icons();
window.__appReady = true;
</script>
