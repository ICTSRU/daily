<style>
  :root{
    --purple:#501e8c; --purple-dark:#3a1464; --purple-light:#f0ebf8;
    --blue:#0a6eaa; --blue-light:#e6f3fa;
    --bg:#f5f2fa; --border:rgba(80,30,140,0.14);
    --ink:#241436; --muted:#77678d; --radius:12px; --radius-sm:8px;
    --noc:#0d5fad; --soc:#c0272d; --dssc:#1f8a3b; --aau:#e0a010; --ops:#7a3fc0;
    --green:#1f8a3b; --amber:#c98a00; --orange:#d9600b; --red:#c0272d;
    --cover-bg:#eef0f3; --cover-bg-2:#e1e4e9; --cover-ink:#2a2d33;
    --shadow-sm:0 1px 3px rgba(58,20,100,0.07), 0 1px 2px rgba(58,20,100,0.05);
    --shadow-md:0 6px 18px rgba(58,20,100,0.10), 0 2px 6px rgba(58,20,100,0.06);
    --shadow-lg:0 14px 36px rgba(58,20,100,0.16);
  }
  *{box-sizing:border-box;}
  html{-webkit-text-size-adjust:100%; scroll-behavior:smooth;}
  body{
    margin:0; background:var(--bg); color:var(--ink);
    font-family:'Cairo',Tahoma,Arial,sans-serif;
    -webkit-font-smoothing:antialiased; line-height:1.6; font-size:14.5px;
  }
  svg.lucide{width:16px; height:16px; stroke-width:2.2; vertical-align:-3px; flex-shrink:0;}

  /* ---------- Header (same as Weekly Status Report) ---------- */
  .topbar{
    background:linear-gradient(120deg, var(--purple-dark) 0%, #2c0f4d 100%);
    color:#fff; padding:14px 26px;
    display:flex; align-items:center; justify-content:space-between; flex-wrap:wrap; gap:16px;
    box-shadow:0 2px 12px rgba(0,0,0,.14); position:relative; z-index:2;
    border-bottom:3px solid var(--ops); overflow:hidden;
  }
  .topbar::before{
    content:''; position:absolute; top:0; left:0; width:180px; height:100%;
    background:linear-gradient(115deg, rgba(122,63,192,.30) 0%, rgba(10,110,170,.18) 55%, transparent 100%);
    transform:skewX(-18deg) translateX(-46px); pointer-events:none;
  }
  .topbar .brand{display:flex; align-items:center; gap:16px; position:relative; z-index:1; min-width:0;}
  .logo-ictd{height:52px; width:auto; flex-shrink:0; background:#fff; border-radius:12px; padding:6px 9px; box-shadow:var(--shadow-md);}
  .brand-right{display:flex; align-items:center; gap:16px; position:relative; z-index:1; flex-wrap:wrap;}
  .logo-ar{width:210px; height:auto; flex-shrink:0; background:#fff; border-radius:12px; padding:8px 14px; box-shadow:var(--shadow-md);}
  .topbar h1{font-size:18.5px; margin:0; font-weight:800; letter-spacing:.01em;}
  .topbar .sub{font-size:11.5px; opacity:.85; margin:3px 0 0; font-weight:500;}
  .user-chip{font-size:12.5px; font-weight:700; background:rgba(255,255,255,.12); padding:7px 14px; border-radius:20px; display:flex; align-items:center; gap:6px; margin:0; direction:ltr;}
  .user-chip[hidden]{display:none;}
  #todayLabel{font-size:12.5px; font-weight:700; background:rgba(255,255,255,.12); padding:7px 16px; border-radius:20px; display:flex; align-items:center; gap:6px; margin:0;}
  .version-badge{font-size:11px; font-weight:800; background:rgba(255,255,255,.16); color:#fff; padding:3px 10px; border-radius:12px; letter-spacing:.04em; margin-left:10px; display:inline-block; vertical-align:middle;}

  .navbar{background:var(--purple); display:flex; gap:2px; padding:0 24px; flex-wrap:wrap; justify-content:center; box-shadow:inset 0 -1px 0 rgba(255,255,255,.08);}
  .navbar button{
    background:transparent; border:none; color:#fff; padding:14px 20px; font-size:14px; font-family:inherit; cursor:pointer;
    opacity:.72; border-bottom:3px solid transparent; font-weight:700; display:flex; align-items:center; gap:8px;
    transition:opacity .15s, border-color .15s, background .15s; border-radius:6px 6px 0 0;
  }
  .navbar button:hover{opacity:.92; background:rgba(255,255,255,.07);}
  .navbar button.active{opacity:1; border-bottom:3px solid #fff;}

  .container{max-width:1180px; margin:0 auto; padding:28px 20px 70px;}
  .view{display:none;}
  .view.active{display:block; animation:fadeIn .25s ease;}
  @keyframes fadeIn{from{opacity:0; transform:translateY(4px);} to{opacity:1; transform:none;}}

  .card{background:#fff; border:1px solid var(--border); border-radius:var(--radius); padding:26px 26px 28px; margin-bottom:20px; box-shadow:var(--shadow-sm);}
  .card h2{margin:0 0 6px; font-size:19px; color:#000; font-weight:900; display:flex; align-items:center; gap:11px;}
  .card h2 .icon-badge{width:34px; height:34px; border-radius:10px; background:var(--purple-light); display:flex; align-items:center; justify-content:center; flex-shrink:0;}
  .card h2 .icon-badge svg{color:var(--purple); width:18px; height:18px;}
  .card .hint{color:var(--muted); font-size:13px; margin:0 0 20px; line-height:1.6;}

  label.fl{display:block; font-size:13px; font-weight:800; color:#000; margin-bottom:7px; margin-top:20px;}
  select, input[type=text], input[type=date], input[type=time], textarea{
    width:100%; padding:11px 14px; border:1.5px solid var(--border); border-radius:var(--radius-sm);
    font-family:inherit; font-size:14px; color:var(--ink); background:#fbfaff;
    transition:border-color .15s, box-shadow .15s, background .15s;
  }
  select:hover, input:hover, textarea:hover{border-color:#c9b8e6;}
  textarea{min-height:70px; resize:vertical;}
  select:focus, input:focus, textarea:focus{outline:none; border-color:var(--purple); background:#fff; box-shadow:0 0 0 3.5px rgba(80,30,140,0.12);}

  .grid3{display:grid; grid-template-columns:1.5fr 1.3fr .7fr; gap:0 16px;}
  .unit-row input[type=date]{flex:1 1 auto; min-width:0;}
  #btn-load-day{padding:10px 14px; font-size:13px;}
  #btn-load-day:disabled{cursor:progress;}
  /* v3.3 — glow while reading from the Google Sheet */
  #btn-load-day .ld-spin{display:none; width:15px; height:15px; border-radius:50%; border:2.4px solid rgba(80,30,140,.25); border-top-color:var(--purple); animation:ldspin .8s linear infinite;}
  #btn-load-day.loading{background:var(--purple-light); border-color:var(--purple); color:var(--purple-dark); animation:ldglow 1.4s ease-in-out infinite; opacity:1;}
  #btn-load-day.loading .ld-ic{display:none;}
  #btn-load-day.loading .ld-spin{display:inline-block;}
  @keyframes ldglow{
    0%,100%{ box-shadow:0 0 0 0 rgba(80,30,140,.35), 0 0 8px rgba(80,30,140,.25); }
    50%    { box-shadow:0 0 0 6px rgba(80,30,140,.10), 0 0 20px rgba(80,30,140,.55); }
  }
  @keyframes ldspin{ to{ transform:rotate(360deg); } }
  .conn.syncing .conn-dot{animation:ldglow 1.4s ease-in-out infinite;}
  @media (prefers-reduced-motion:reduce){ #btn-load-day.loading{animation:none; box-shadow:0 0 0 4px rgba(80,30,140,.18), 0 0 14px rgba(80,30,140,.45);} #btn-load-day .ld-spin{animation-duration:2s;} }
  .grid3 > div{min-width:0;}
  @media (max-width:760px){ .grid3{grid-template-columns:1fr;} }
  .unit-row{display:flex; gap:10px;}
  .unit-row select{flex:1 1 auto; min-width:0;}
  .unit-row .btn{flex:0 0 auto; white-space:nowrap;}

  .btn{
    background:var(--purple); color:#fff; border:none; border-radius:var(--radius-sm);
    padding:12px 24px; font-size:14px; font-weight:700; cursor:pointer; font-family:inherit;
    display:inline-flex; align-items:center; gap:8px; transition:all .15s; box-shadow:var(--shadow-sm);
  }
  .btn:hover{background:var(--purple-dark); box-shadow:var(--shadow-md); transform:translateY(-1px);}
  .btn.secondary{background:#fff; color:var(--purple); border:1.5px solid var(--purple); box-shadow:none;}
  .btn.secondary:hover{background:var(--purple-light);}
  .btn.sm{padding:8px 14px; font-size:12.5px;}
  .btn-row{display:flex; gap:12px; margin-top:24px; flex-wrap:wrap;}
  .btn-add{
    background:var(--purple-light); color:var(--purple); border:1.5px dashed #c9b0e8; border-radius:var(--radius-sm);
    padding:7px 14px; font-size:12.5px; font-weight:700; cursor:pointer; font-family:inherit; display:inline-flex; align-items:center; gap:6px; transition:all .15s;
  }
  .btn-add:hover{background:var(--purple); color:#fff; border-style:solid;}
  .btn-remove{background:transparent; border:none; color:var(--muted); cursor:pointer; width:28px; height:28px; border-radius:50%; display:inline-flex; align-items:center; justify-content:center; flex-shrink:0;}
  .btn-remove:hover{background:#fdecec; color:var(--red);}

  /* banner */
  .banner{display:flex; align-items:center; gap:10px; padding:11px 14px; border-radius:var(--radius-sm); font-size:13px; font-weight:700; margin:18px 0 0;}
  .banner.info{background:var(--blue-light); color:#064a73;}
  .banner.edit{background:#fff8e6; color:#7a5800;}
  .banner.local{background:#fdecec; color:#8a1c20; margin:0 0 18px;}
  .banner[hidden]{display:none;}
  .conn{display:flex; align-items:center; gap:10px; flex-wrap:wrap; padding:10px 14px; border-radius:var(--radius-sm); margin:0 0 18px; font-size:13px; font-weight:700; background:#fff; border:1px solid var(--border); box-shadow:var(--shadow-sm);}
  .conn .sp{flex:1;}
  .conn-dot{width:11px; height:11px; border-radius:50%; background:#bbb; flex-shrink:0;}
  .conn.ok .conn-dot{background:var(--green); box-shadow:0 0 0 4px rgba(31,138,59,.15);}
  .conn.local .conn-dot{background:var(--amber); box-shadow:0 0 0 4px rgba(201,138,0,.15);}
  .conn.err .conn-dot{background:var(--red); box-shadow:0 0 0 4px rgba(192,39,45,.15);}
  .conn.local{background:#fffaf0;} .conn.err{background:#fff5f5;}
  .conn [hidden]{display:none !important;}
  .saved-row{display:flex; gap:10px; align-items:center; flex-wrap:wrap; margin-top:14px;}
  .saved-row select{flex:1 1 320px; width:auto;}
  .saved-row .lbl{font-size:13px; font-weight:800; color:#000;}
  .banner .sp{flex:1;}
  .banner .btn{padding:6px 12px; font-size:12px;}
  .unit-card .card-actions{display:flex; gap:8px; margin-top:10px;}
  .unit-card .card-actions .btn{padding:6px 12px; font-size:12px;}

  /* Status pills / dots */
  .pill{display:inline-flex; align-items:center; gap:5px; padding:3px 11px; border-radius:20px; font-size:11.5px; font-weight:800; white-space:nowrap;}
  .st-Normal{background:#eafaf0; color:var(--green);}
  .st-Minor{background:#fff8e6; color:#8a6400;}
  .st-Major{background:#fff0e6; color:#a34400;}
  .st-Critical{background:#fdecec; color:var(--red);}
  .st-None{background:#f0f0f0; color:var(--muted);}
  .dot{display:inline-block; width:15px; height:15px; border-radius:50%;}
  .dot-Normal{background:var(--green);} .dot-Minor{background:var(--amber);} .dot-Major{background:var(--orange);} .dot-Critical{background:var(--red);} .dot-None{background:#e2dfe8;}
  .legend{display:flex; gap:14px; flex-wrap:wrap; font-size:12px; font-weight:700; color:var(--muted); align-items:center;}
  .legend span{display:inline-flex; align-items:center; gap:6px;}
  .legend .dot{width:11px; height:11px;}

  /* ---------- Checklist editor ---------- */
  .summary-bar{
    display:flex; align-items:center; gap:12px; flex-wrap:wrap; margin-top:22px; padding:13px 16px;
    border:1.5px dashed var(--border); border-radius:var(--radius-sm); background:#fbfaff; position:sticky; top:0; z-index:5;
  }
  .summary-bar .lbl{font-size:12.5px; font-weight:900; color:#000;}
  .summary-bar .counts{display:flex; gap:8px; flex-wrap:wrap;}
  .summary-bar .spacer{flex:1;}
  .grp{margin-top:20px; border:1px solid var(--border); border-radius:var(--radius); overflow:hidden;}
  .grp-head{display:flex; align-items:center; gap:10px; padding:10px 14px; background:var(--purple-light); font-weight:900; font-size:13.5px; color:var(--purple-dark);}
  .grp-head .n{font-size:11.5px; font-weight:800; color:var(--muted);}
  .grp-head .sp{flex:1;}
  .item{display:grid; grid-template-columns:minmax(140px,1fr) minmax(160px,1.2fr) minmax(150px,1.4fr) 222px 112px 28px; gap:8px; align-items:center; padding:7px 14px; border-top:1px solid var(--border);}
  .item.nossl{grid-template-columns:minmax(150px,1fr) minmax(180px,1.3fr) minmax(200px,1.8fr) 112px 28px;}
  .item > div{min-width:0;}
  .item.flag{background:#fffaf2;}
  .item .nm input{font-weight:800; font-size:13.3px;}
  .item .ur{display:flex; align-items:center; gap:4px;}
  .item .ur input{font-size:12px; color:var(--blue); font-weight:600; display:none;}
  .item .ur.editing input{display:block;}
  .item .ur.editing .url-link{display:none;}
  .url-link{flex:1 1 auto; min-width:0; display:inline-flex; align-items:center; gap:6px; padding:7px 10px; border:1.5px solid transparent; border-radius:var(--radius-sm);
    color:var(--blue); font-size:12.3px; font-weight:700; text-decoration:none; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; background:var(--blue-light);}
  .url-link span{overflow:hidden; text-overflow:ellipsis;}
  .url-link:hover{text-decoration:underline; border-color:#9cc9e6;}
  .url-link:focus-visible{outline:2px solid var(--blue); outline-offset:1px;}
  .url-link .ext{flex:0 0 auto; font-size:11px; opacity:.8;}
  .btn-edit-url{flex:0 0 auto; background:transparent; border:none; color:var(--muted); cursor:pointer; width:26px; height:26px; border-radius:50%; font-size:13px;}
  .btn-edit-url:hover{background:var(--purple-light); color:var(--purple);}
  .item .ur.editing .btn-edit-url{display:none;}
  .item input, .item select{padding:7px 10px; font-size:13px;}
  .item .ssl{display:flex; align-items:center; gap:6px;}
  .item .ssl input{flex:1 1 auto; min-width:0;}
  .item .ssl .badge{flex:0 0 auto; font-size:10.5px; font-weight:800; text-align:center; padding:2px 7px; border-radius:10px; white-space:nowrap; min-width:58px;}
  select.st{font-weight:800;}
  select.st.st-Normal{border-color:#9fd8b2;} select.st.st-Minor{border-color:#ecc96a;}
  select.st.st-Major{border-color:#f0a777;} select.st.st-Critical{border-color:#e48e91;}
  .item-cols{display:grid; grid-template-columns:minmax(140px,1fr) minmax(160px,1.2fr) minmax(150px,1.4fr) 222px 112px 28px; gap:8px; padding:6px 14px; font-size:11px; font-weight:900; color:var(--muted); text-transform:uppercase; letter-spacing:.05em; background:#fff;}
  .item-cols.nossl{grid-template-columns:minmax(150px,1fr) minmax(180px,1.3fr) minmax(200px,1.8fr) 112px 28px;}
  .item.nourl, .item-cols.nourl{grid-template-columns:minmax(140px,1fr) minmax(200px,2.4fr) 222px 112px 28px;}
  .item.nossl.nourl, .item-cols.nossl.nourl{grid-template-columns:minmax(150px,1fr) minmax(260px,3.1fr) 112px 28px;}
  .grp-foot{padding:8px 14px 12px; border-top:1px solid var(--border);}
  @media (max-width:760px){
    .item, .item.nossl{grid-template-columns:1fr 1fr; }
    .item .nm, .item .ur, .item .nt{grid-column:1/-1;}
    .item-cols{display:none;}
  }

  .list-field{display:flex; flex-direction:column; gap:7px;}
  .list-row{display:flex; align-items:center; gap:8px;}
  .list-row .num{flex:0 0 22px; text-align:center; font-size:12px; font-weight:800; color:#fff; background:var(--purple); border-radius:50%; width:22px; height:22px; line-height:22px;}
  .list-row input{flex:1; padding:9px 12px; font-size:13.3px;}
  .risk-label.on{color:var(--red);}
  .risk-label.on::after{content:'!'; display:inline-flex; align-items:center; justify-content:center; width:15px; height:15px; margin-left:7px; border-radius:50%; background:var(--red); color:#fff; font-size:10px; font-weight:900; vertical-align:middle;}
  .two-col{display:grid; grid-template-columns:1fr 1fr; gap:0 18px;}
  .two-col > div{min-width:0;}
  .two-col.single{grid-template-columns:1fr;}
  /* v3.3 — summary & team panel, visually separated from the checklist */
  .extras-panel{margin-top:20px; padding:6px 22px 22px; background:linear-gradient(180deg, #eaf4fb 0%, #f2f8fc 100%);
    border:1px solid #c6e0f0; border-left:5px solid var(--blue); border-radius:var(--radius); box-shadow:var(--shadow-sm);}
  .extras-head{display:flex; align-items:center; gap:8px; margin:12px 0 -4px; font-size:13px; font-weight:900; color:#064a73; text-transform:uppercase; letter-spacing:.05em;}
  .extras-head svg{color:var(--blue);}
  .extras-panel input[type=text], .extras-panel select, .extras-panel textarea{background:#fff; border-color:#c6dceb;}
  .extras-panel input:focus, .extras-panel select:focus, .extras-panel textarea:focus{border-color:var(--blue); box-shadow:0 0 0 3.5px rgba(10,110,170,.14);}
  .extras-panel .btn-add{background:#fff; color:var(--blue); border-color:#9cc9e6;}
  .extras-panel .btn-add:hover{background:var(--blue); color:#fff; border-color:var(--blue);}
  .extras-panel .list-row .num{background:var(--blue);}
  /* v3.3 — screenshots / images */
  .att-hint{margin:-2px 0 10px; font-size:12.3px; color:#3d5d73;}
  .att-row{display:grid; grid-template-columns:132px 1fr 28px; gap:12px; align-items:center; background:#fff; border:1.5px dashed #9cc9e6; border-radius:var(--radius-sm); padding:10px; margin-bottom:10px; outline:none;}
  .att-row:focus-within, .att-row.drag{border-style:solid; border-color:var(--blue); box-shadow:0 0 0 3px rgba(10,110,170,.12);}
  .att-thumb{width:132px; height:84px; border-radius:6px; background:#f2f8fc; border:1px solid #d6e8f4; display:flex; align-items:center; justify-content:center; overflow:hidden; color:#7aa6c2; font-size:11px; font-weight:700; text-align:center;}
  .att-thumb img{width:100%; height:100%; object-fit:cover; display:block;}
  .att-thumb a{display:block; width:100%; height:100%;}
  .att-fields{display:flex; flex-direction:column; gap:8px; min-width:0;}
  .att-line{display:flex; gap:8px; align-items:center; flex-wrap:wrap; min-width:0;}
  .att-line select{flex:0 0 170px; width:auto; padding:8px 10px; font-size:13px; font-weight:700;}
  .att-line input[data-a="cap"]{flex:1 1 220px; min-width:0; padding:8px 10px; font-size:13px;}
  .att-pick{display:inline-flex; align-items:center; gap:6px; padding:7px 12px; border:1.5px solid var(--blue); color:var(--blue); background:#fff; border-radius:6px; font-size:12.5px; font-weight:800; cursor:pointer;}
  .att-pick:hover{background:var(--blue); color:#fff;}
  .att-pick input{display:none;}
  .att-state{font-size:12px; font-weight:700; color:var(--muted);}
  .att-state.up{color:var(--blue);} .att-state.ok{color:var(--green);} .att-state.err{color:var(--red);}
  @media (max-width:640px){ .att-row{grid-template-columns:1fr 28px;} .att-thumb{grid-column:1/-1; width:100%; height:140px;} .att-line select{flex:1 1 100%;} }
  .att-strip{display:flex; gap:6px; flex-wrap:wrap; margin-top:6px;}
  .att-strip a{display:block; width:72px; height:46px; border-radius:5px; overflow:hidden; border:1px solid var(--border);}
  .att-strip img{width:100%; height:100%; object-fit:cover; display:block;}
  .rep-img{margin:10px 0 14px; break-inside:avoid; page-break-inside:avoid;}
  .rep-img img{max-width:100%; height:auto; border:1px solid var(--border); border-radius:6px; display:block;}
  .rep-img .cap{font-size:12.5px; font-weight:700; color:#333; margin-top:5px;}
  .rep-img .cap em{font-style:normal; color:var(--muted); font-weight:600;}
  .extras-panel label.fl{color:#0b3550;}
  @media (max-width:640px){ .extras-panel{padding:4px 14px 16px;} }
  @media print{ .extras-panel{-webkit-print-color-adjust:exact; print-color-adjust:exact;} }
  .abs-row input[data-a="n"]{flex:1.2 1 0; min-width:0;}
  .sup-row select[data-p="n"]{flex:1.2 1 0; min-width:0; padding:9px 12px; font-size:13.3px; font-weight:700;}
  .sup-row input[data-p="o"]{flex:1 1 0; min-width:0;}
  .sup-row input[data-p="o"][hidden]{display:none;}
  .sup-row input[data-p="t"]{flex:1.5 1 0; min-width:0;}
  @media (max-width:760px){ .sup-row{flex-wrap:wrap;} .sup-row select[data-p="n"]{flex:1 1 100%;} }
  .abs-row select{flex:0 0 190px; padding:9px 12px; font-size:13.3px;}
  .abs-row input[data-a="t"]{flex:1.5 1 0; min-width:0;}
  @media (max-width:760px){ .abs-row{flex-wrap:wrap;} .abs-row select{flex:1 1 100%;} }
  .abs-chip{display:inline-flex; align-items:center; gap:5px; background:#f3eefb; color:var(--purple-dark); border:1px solid var(--border); border-radius:20px; padding:2px 10px; font-size:12px; font-weight:700; margin:2px 4px 2px 0;}
  .abs-chip em{font-style:normal; color:var(--muted); font-weight:600;}
  @media (max-width:760px){ .two-col{grid-template-columns:1fr;} }

  /* ---------- Dashboard ---------- */
  .day-nav{display:flex; align-items:center; gap:10px; flex-wrap:wrap; margin-bottom:20px;}
  .day-nav input[type=date]{width:auto; min-width:170px; font-weight:700;}
  .day-nav .day-label{font-size:15px; font-weight:900; color:#000; margin-left:6px;}
